# SonarCloud analysis settings. projectKey and organization are injected by
# the CI/CD workflows (-Dsonar.projectKey / -Dsonar.organization) so this file
# stays generic across forks/organizations.
sonar.projectName=Vehicle Sales Service
sonar.sources=src,scripts
sonar.tests=tests
sonar.test.inclusions=tests/**
sonar.python.version=3.13
# coverage.xml is produced by `pytest --cov=src --cov-report=xml` run from
# service/, so its paths resolve under sonar.projectBaseDir (service/).
sonar.python.coverage.reportPaths=coverage.xml
# Generated Alembic migrations (src/infrastructure/alembic/versions/) are not
# analyzed; alembic env/scripts, the app entrypoint and operational tooling
# (scripts/seed.py) are analyzed but excluded from the coverage metric.
sonar.exclusions=**/__pycache__/**,**/alembic/versions/**
sonar.coverage.exclusions=tests/**,src/main.py,scripts/**,**/alembic/**
sonar.sourceEncoding=UTF-8
