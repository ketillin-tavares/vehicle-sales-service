name: vehicle-sales

services:
  postgres:
    image: postgres:17-alpine
    container_name: vehicle-sales-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-vehicle_sales_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-vehicle_sales_pass}
      POSTGRES_DB: ${DATABASE_NAME:-vehicle_sales}
    ports:
      - "5433:5432"
    volumes:
      - vehicle_sales_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-vehicle_sales_user} -d ${DATABASE_NAME:-vehicle_sales}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vehicle-sales-network

  migrations:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: vehicle-sales-migrations
    env_file: [.env]
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vehicle-sales-network

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: vehicle-sales-seed
    env_file: [.env]
    command: ["python", "scripts/seed.py"]
    depends_on:
      migrations:
        condition: service_completed_successfully
    networks:
      - vehicle-sales-network

  vehicle-sales-service:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: vehicle-sales-service
    env_file: [.env]
    ports:
      - "8001:8000"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - vehicle-sales-network
      - vehicle-platform

networks:
  vehicle-sales-network:
    driver: bridge
  vehicle-platform:
    external: true

volumes:
  vehicle_sales_postgres_data:
