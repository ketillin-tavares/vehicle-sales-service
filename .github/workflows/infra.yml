# Infra — manual create/destroy of the AWS stack through Terraform Cloud
# (HCP Terraform, CLI-driven remote runs; root module: infra/main).
# The root's `cloud {}` block takes organization and workspace from the
# TF_CLOUD_ORGANIZATION / TF_WORKSPACE env vars below (TF_WORKSPACE must be
# `vehicle-sales-infra`).
# Guards (plan item 9): the job runs in the GitHub environment `infra`, which
# MUST be created in repo Settings > Environments with required reviewers;
# destroy additionally requires confirm == 'vehicle-sales-service'.
name: Infra

on:
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run
        type: choice
        required: true
        options:
          - apply
          - destroy
      confirm:
        description: Type 'vehicle-sales-service' to confirm when action=destroy (any value for apply)
        type: string
        required: true

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: infra
    env:
      TF_CLOUD_ORGANIZATION: ${{ vars.TF_CLOUD_ORGANIZATION }}
      TF_WORKSPACE: ${{ vars.TF_WORKSPACE }}
      TF_IN_AUTOMATION: "true"
    defaults:
      run:
        working-directory: infra/main
    steps:
      - name: Guard destroy confirmation
        if: inputs.action == 'destroy' && inputs.confirm != 'vehicle-sales-service'
        working-directory: .
        run: |
          echo "::error::To destroy, the 'confirm' input must equal 'vehicle-sales-service'."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform fmt check
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan ${{ inputs.action == 'destroy' && '-destroy' || '' }} -input=false

      - name: Terraform apply
        if: inputs.action == 'apply'
        run: terraform apply -auto-approve -input=false

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: terraform destroy -auto-approve -input=false
